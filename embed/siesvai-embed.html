<div id="siesvai-widget-root">
  <style>
    #siesvai-widget-root {
      --sw-ink: #1B2A4A;
      --sw-saffron: #E8A33D;
      --sw-saffron-deep: #C9821F;
      --sw-cream: #FBF6EC;
      all: initial;
    }

    #siesvai-widget-root * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }

    #siesvai-bubble-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--sw-ink);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 24px rgba(27, 42, 74, 0.35);
      z-index: 999999;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      animation: siesvai-bob 2.6s ease-in-out infinite;
    }

    @keyframes siesvai-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    #siesvai-bubble-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(27, 42, 74, 0.4);
      animation-play-state: paused;
    }

    #siesvai-bubble-btn:active {
      transform: scale(0.95);
    }

    #siesvai-bubble-btn svg {
      width: 26px;
      height: 26px;
    }

    #siesvai-bubble-dot {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--sw-saffron);
      border: 2px solid var(--sw-cream);
    }

    #siesvai-panel {
      position: fixed;
      bottom: 96px;
      right: 24px;
      width: 380px;
      height: 600px;
      max-height: calc(100vh - 120px);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 48px rgba(27, 42, 74, 0.25);
      overflow: hidden;
      z-index: 999998;
      opacity: 0;
      transform: translateY(16px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }

    #siesvai-panel.siesvai-open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #siesvai-panel iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #siesvai-panel-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(27, 42, 74, 0.85);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      transition: background 0.15s ease;
    }

    #siesvai-panel-close:hover {
      background: var(--sw-saffron-deep);
    }

    #siesvai-panel-close svg {
      width: 14px;
      height: 14px;
      stroke: #fff;
    }

    @media (max-width: 480px) {
      #siesvai-panel {
        bottom: 0;
        right: 0;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        max-height: 100%;
        border-radius: 0;
      }

      #siesvai-bubble-btn {
        bottom: 18px;
        right: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #siesvai-panel,
      #siesvai-bubble-btn {
        transition: none;
        animation: none;
      }
    }
  </style>

    <button id="siesvai-panel-close" aria-label="Close chat">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="4" x2="16" y2="16"></line><line x1="16" y1="4" x2="4" y2="16"></line></svg>

<script>
  (function () {
    var IFRAME_SRC = "https://anandprince2004.github.io/siesvai/";

    var bubbleBtn = document.getElementById("siesvai-bubble-btn");
    var panel = document.getElementById("siesvai-panel");
    var closeBtn = document.getElementById("siesvai-panel-close");
    var iframeLoaded = false;

    function openPanel() {
      if (!iframeLoaded) {
        var iframe = document.createElement("iframe");
        iframe.src = IFRAME_SRC;
        iframe.title = "SIESVAI Chat Assistant";
        panel.appendChild(iframe);
        iframeLoaded = true;
      }
      panel.classList.add("siesvai-open");
      panel.setAttribute("aria-hidden", "false");
      bubbleBtn.setAttribute("aria-expanded", "true");
    }

    function closePanel() {
      panel.classList.remove("siesvai-open");
      panel.setAttribute("aria-hidden", "true");
      bubbleBtn.setAttribute("aria-expanded", "false");
    }

    function togglePanel() {
      if (panel.classList.contains("siesvai-open")) {
        closePanel();
      } else {
        openPanel();
      }
    }

    bubbleBtn.addEventListener("click", togglePanel);
    closeBtn.addEventListener("click", closePanel);

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && panel.classList.contains("siesvai-open")) {
        closePanel();
      }
    });
  })();
</script>
