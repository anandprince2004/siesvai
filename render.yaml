services:
  - type: web
    name: siesvai-backend
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: >
      pip install -r requirements.txt &&
      python scripts/build_vector_db.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /health
